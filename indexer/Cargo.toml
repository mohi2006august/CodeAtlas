[package]
name = "indexer"
version = "0.1.0"
edition = "2021"
description = "CodeAtlas structural indexer: tree-sitter symbols, cross-reference graph, incremental updates"
license = "MIT"
authors = ["mohi2006august <nizamuddinnumaan822@gmail.com>"]

[lib]
name = "indexer"
path = "src/lib.rs"

[[bin]]
name = "codeatlas-indexer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-julia = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-lua = "0.5"
tree-sitter-objc = "3"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-r = "1"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1"

[dev-dependencies]
tempfile = "3"
